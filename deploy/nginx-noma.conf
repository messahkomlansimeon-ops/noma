# nginx — Noma préproduction PRIVÉE
# À adapter : domaine, certificats, IP des testeurs autorisés.
# Aucun accès public : la liste allow est OBLIGATOIRE sur toutes les routes,
# y compris /api/search. Aucun accès direct au port Node (écoute 127.0.0.1).

server {
    listen 80;
    server_name <domaine.exemple>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <domaine.exemple>;

    ssl_certificate     /etc/letsencrypt/live/<domaine.exemple>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domaine.exemple>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── Accès restreint aux testeurs (OBLIGATOIRE, y compris /api/search) ─────
    # Remplacer par les IP réelles des testeurs autorisés.
    allow <ip-testeur-1>;
    allow <ip-testeur-2>;
    deny all;

    # ── Fichiers statiques Next ────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Flux de recherche : SANS tamponnement ni compression ─────────────────
    location /api/search {
        allow <ip-testeur-1>;
        allow <ip-testeur-2>;
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;          # NDJSON progressif : jamais bufferisé
        proxy_cache off;
        gzip off;                     # aucune compression qui bufferiserait
        proxy_read_timeout 200s;      # échéance globale applicative : 180 s
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header x-noma-proxy-secret "<INSÉRER NOMA_PROXY_SECRET — même valeur que l'app>";
    }

    # ── Reste de l'application ────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header x-noma-proxy-secret "<INSÉRER NOMA_PROXY_SECRET>";
    }
}
